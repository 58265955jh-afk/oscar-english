<style>
  :root{--paper:#EEF7EC;--ink:#10261C;--body:#3D5B4B;--teal:#15803D}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--paper);color:var(--body);
       font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
       padding:24px;text-align:center}
  .card{max-width:520px}
  .brand{font-size:14px;letter-spacing:.18em;color:var(--teal);font-weight:700;margin-bottom:18px}
  h1{font-size:26px;line-height:1.4;color:var(--ink);margin:0 0 12px}
  p{font-size:15px;line-height:1.7;margin:0 0 26px}
  a.btn{display:inline-block;padding:14px 26px;border-radius:10px;background:var(--ink);
        color:#fff;text-decoration:none;font-weight:700;font-size:15px}
  a.btn:hover{background:var(--teal)}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">OSCAR ENGLISH</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>잠시 후 오스카 잉글리쉬 홈으로 이동합니다.</p>
    <a class="btn" href="/">홈으로 가기</a>
  </div>
</body>
